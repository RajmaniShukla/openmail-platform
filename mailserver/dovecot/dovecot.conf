# OpenMail Dovecot Configuration
# See https://doc.dovecot.org/configuration_manual/

# Protocols to enable
protocols = imap pop3 lmtp sieve

# Listen on all interfaces
listen = *, ::

# Base directory
base_dir = /var/run/dovecot/

# Instance name
instance_name = openmail

# Login configuration
login_greeting = OpenMail ready.
login_trusted_networks = 172.16.0.0/12

# Mail location (Maildir format)
mail_location = maildir:/var/mail/vhosts/%d/%n

# Mail user and group
mail_uid = vmail
mail_gid = vmail
mail_privileged_group = vmail
first_valid_uid = 5000
last_valid_uid = 5000

# Namespace configuration
namespace inbox {
  inbox = yes
  separator = /
  
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox "Sent Messages" {
    special_use = \Sent
  }
  mailbox Spam {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

# Authentication
auth_mechanisms = plain login
disable_plaintext_auth = yes

# Passdb and userdb (SQL)
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

# Service configuration
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    group = postfix
    mode = 0600
    user = postfix
  }
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
  }
}

# SSL/TLS
ssl = required
ssl_cert = </etc/ssl/mail/fullchain.pem
ssl_key = </etc/ssl/mail/privkey.pem
ssl_min_protocol = TLSv1.2
ssl_cipher_list = ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
ssl_prefer_server_ciphers = yes

# Logging
log_path = /dev/stderr
info_log_path = /dev/stdout
debug_log_path = /dev/stdout

# Mail plugins
protocol imap {
  mail_plugins = $mail_plugins imap_sieve
}

protocol lmtp {
  mail_plugins = $mail_plugins sieve
}

# Sieve plugin
plugin {
  sieve = file:~/sieve;active=~/.dovecot.sieve
  sieve_default = /var/mail/vhosts/default.sieve
  sieve_global_dir = /var/mail/vhosts/global-sieve/
}

# Include additional configs
!include conf.d/*.conf
