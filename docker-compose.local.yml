# ============================================================
# docker-compose.local.yml — Lightweight local dev stack
# Usage: docker compose -f docker-compose.local.yml up -d
#
# What's included:
#   postgres, redis, elasticsearch, minio
#   backend (API), frontend (webmail)
#   celery-worker, celery-beat
#
# What's skipped (not needed for local UI/API testing):
#   nginx        — access frontend:3000 and backend:8000 directly
#   postfix      — can't send real external email from localhost
#   dovecot      — no real IMAP needed for local testing
#   spamassassin — not needed without a real mail server
#   prometheus   — optional monitoring
#   grafana      — optional monitoring
# ============================================================

version: '3.8'

services:

  # ----------------------------------------------------------
  # DATABASE
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: openmail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: openmail
      POSTGRES_PASSWORD: openmail_dev_pass
      POSTGRES_DB: openmail
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmail"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openmail-network

  # ----------------------------------------------------------
  # CACHE
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: openmail-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openmail-network

  # ----------------------------------------------------------
  # SEARCH  (needs vm.max_map_count=262144 on Linux/WSL2)
  # ----------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: openmail-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - openmail-network

  # ----------------------------------------------------------
  # OBJECT STORAGE (attachments)
  # ----------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: openmail-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console
    networks:
      - openmail-network

  # ----------------------------------------------------------
  # BACKEND — FastAPI
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openmail-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://openmail:openmail_dev_pass@postgres:5432/openmail
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - S3_ENDPOINT=minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin123
      - POSTFIX_HOST=localhost
      - SPAMASSASSIN_HOST=localhost
      - DEBUG=true
    volumes:
      - ./data/attachments:/app/attachments
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - openmail-network

  # ----------------------------------------------------------
  # FRONTEND — Next.js Webmail
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: openmail-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    depends_on:
      - backend
    networks:
      - openmail-network

  # ----------------------------------------------------------
  # BACKGROUND WORKERS
  # ----------------------------------------------------------
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openmail-celery-worker
    restart: unless-stopped
    command: celery -A app.celery worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://openmail:openmail_dev_pass@postgres:5432/openmail
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      - ./data/attachments:/app/attachments
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - openmail-network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openmail-celery-beat
    restart: unless-stopped
    command: celery -A app.celery beat --loglevel=info
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://openmail:openmail_dev_pass@postgres:5432/openmail
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - celery-worker
    networks:
      - openmail-network

volumes:
  postgres-data:
  redis-data:
  elasticsearch-data:
  minio-data:

networks:
  openmail-network:
    driver: bridge
